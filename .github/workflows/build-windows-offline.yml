name: Build Windows Offline Installer

on:
  workflow_dispatch:
    inputs:
      build_nsis:
        description: "Also build NSIS installer (Setup.exe)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. Build console frontend
      # ----------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build console frontend
        run: |
          cd console
          npm install
          npm run build

      # ----------------------------------------------------------------
      # 2. Copy frontend to package and build wheel
      # ----------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        run: |
          $consoleDest = "src\qwenpaw\console"
          if (Test-Path $consoleDest) {
            Remove-Item -Path "$consoleDest\*" -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            New-Item -ItemType Directory -Force -Path $consoleDest | Out-Null
          }
          Copy-Item -Path "console\dist\*" -Destination $consoleDest -Recurse -Force
          python -m pip install --quiet build
          python -m build --outdir dist .

      # ----------------------------------------------------------------
      # 3. Create virtual environment and install qwenpaw
      # ----------------------------------------------------------------
      - name: Install qwenpaw with dependencies
        run: |
          python -m venv .venv
          & .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          $wheel = (Get-ChildItem -Path dist\qwenpaw-*.whl | Select-Object -First 1).FullName
          python -m pip install "$wheel[full]"
          python -c "import qwenpaw; print('qwenpaw OK')"
          python -c "import certifi; print('certifi OK')"

      # ----------------------------------------------------------------
      # 4. Run PyInstaller
      # ----------------------------------------------------------------
      - name: Install PyInstaller
        run: |
          & .venv\Scripts\Activate.ps1
          python -m pip install pyinstaller

      - name: Run PyInstaller
        run: |
          & .venv\Scripts\Activate.ps1
          pyinstaller scripts\pack\qwenpaw.spec --noconfirm

      - name: Verify output
        run: |
          $exePath = "dist\QwenPaw\QwenPaw.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length / 1MB
            Write-Host "QwenPaw.exe built successfully ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "QwenPaw.exe not found!"
          }

      # ----------------------------------------------------------------
      # 5. (Optional) Build NSIS installer
      # ----------------------------------------------------------------
      - name: Install NSIS
        if: ${{ inputs.build_nsis == 'true' }}
        run: choco install nsis -y

      - name: Build NSIS installer
        if: ${{ inputs.build_nsis == 'true' }}
        run: |
          $verFile = "src\qwenpaw\__version__.py"
          $version = ""
          foreach ($line in Get-Content $verFile) {
            if ($line -match '__version__\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
          if (-not $version) { $version = "0.0.0" }
          Write-Host "Version: $version"
          makensis /DQWENPAW_VERSION=$version scripts\pack\portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          $setupExe = "dist\QwenPaw-Setup-$version.exe"
          if (Test-Path $setupExe) {
            $size = (Get-Item $setupExe).Length / 1MB
            Write-Host "NSIS installer built ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "NSIS installer not found!"
          }

      # ----------------------------------------------------------------
      # 6. Upload artifacts
      # ----------------------------------------------------------------
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Portable-Windows
          path: dist/QwenPaw/
          retention-days: 7

      - name: Upload debug folder
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Debug-Windows
          path: dist/QwenPaw-Debug/
          retention-days: 7

      - name: Upload NSIS installer
        if: ${{ inputs.build_nsis == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Setup-Installer
          path: dist/QwenPaw-Setup-*.exe
          retention-days: 7
